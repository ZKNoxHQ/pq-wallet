<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Safe App host (development)</title>
    <style>
      html, body { margin: 0; background: #09090a; color: #ececed; height: 100%;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
      header { display: flex; gap: 10px; align-items: center; padding: 10px 14px;
        border-bottom: 1px solid #26262c; background: #141417; flex-wrap: wrap; }
      input { background: #0e0e10; border: 1px solid #26262c; border-radius: 7px; color: #ececed;
        padding: 6px 9px; font: 12px ui-monospace, Menlo, monospace; min-width: 270px; }
      label { color: #6b6b74; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
      button { background: linear-gradient(180deg, #7c3aed, #5b21b6); border: 0; border-radius: 7px;
        color: #fff; padding: 7px 14px; font-weight: 600; cursor: pointer; }
      #log { color: #6b6b74; font: 11px ui-monospace, Menlo, monospace; margin-left: auto; }
      iframe { width: 100%; height: calc(100% - 46px); border: 0; display: block; background: #0b0b0c; }
      .warn { padding: 8px 14px; background: #1e1709; color: #fbbf24; font-size: 12px;
        border-bottom: 1px solid #3d2f0c; }
    </style>
  </head>
  <body>
    <div class="warn">
      Development host. It answers the Safe Apps protocol with a Safe read straight from an RPC, so the app
      can be exercised in a frame without app.safe.global. It is not Safe&#123;Wallet&#125;: it signs
      nothing, proposes nothing, and enforces no permission.
    </div>
    <header>
      <label for="safe">Safe</label><input id="safe" placeholder="0x…" />
      <label for="rpc">RPC</label><input id="rpc" value="http://127.0.0.1:8545" />
      <button id="load">frame it</button>
      <span id="log"></span>
    </header>
    <iframe id="app" title="Safe App"
      sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms allow-downloads allow-orientation-lock"></iframe>

    <script type="module">
      // The slice of apps/web/src/components/safe-apps/AppFrame the app actually uses:
      //   getSafeInfo   → read from the chain, the shape of SafeInfoExtended
      //   getChainInfo  → id and name
      //   rpcCall       → straight to the RPC, as the real host does with its read-only provider
      //   sendTransactions / signMessage → refused, as they would be meaningless here
      const $ = (id) => document.getElementById(id);
      const q = new URLSearchParams(location.search);
      $('safe').value = q.get('safe') ?? '';
      $('rpc').value = q.get('rpc') ?? 'http://127.0.0.1:8545';

      let rpcUrl = $('rpc').value;
      let safeAddress = $('safe').value;
      let seq = 0;
      const note = (t) => ($('log').textContent = t);

      const rpc = async (method, params = []) => {
        const res = await fetch(rpcUrl, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ jsonrpc: '2.0', id: ++seq, method, params }),
        });
        const body = await res.json();
        if (body.error) throw new Error(body.error.message ?? 'RPC error');
        return body.result;
      };

      const call = (to, data) => rpc('eth_call', [{ to, data }, 'latest']);
      const SEL = {
        // cast sig
        getOwners: '0xa0e67e2b', getThreshold: '0xe75235b8', nonce: '0xaffed0e0', VERSION: '0xffa1ad74',
      };
      const addressesFrom = (hex) => {
        const w = hex.slice(2).match(/.{64}/g) ?? [];
        const n = parseInt(w[1], 16);
        return w.slice(2, 2 + n).map((x) => '0x' + x.slice(24));
      };
      const stringFrom = (hex) => {
        const w = hex.slice(2).match(/.{64}/g) ?? [];
        const len = parseInt(w[1], 16);
        const bytes = w.slice(2).join('').slice(0, len * 2);
        return bytes.replace(/../g, (b) => String.fromCharCode(parseInt(b, 16)));
      };

      async function safeInfo() {
        const [owners, threshold, nonce, version, chainIdHex] = await Promise.all([
          call(safeAddress, SEL.getOwners),
          call(safeAddress, SEL.getThreshold),
          call(safeAddress, SEL.nonce),
          call(safeAddress, SEL.VERSION).catch(() => null),
          rpc('eth_chainId'),
        ]);
        return {
          safeAddress,
          chainId: parseInt(chainIdHex, 16),
          threshold: parseInt(threshold, 16),
          owners: addressesFrom(owners),
          isReadOnly: true,
          nonce: parseInt(nonce, 16),
          implementation: '0x0000000000000000000000000000000000000000',
          modules: [],
          fallbackHandler: null,
          guard: null,
          version: version ? stringFrom(version) : null,
        };
      }

      const reply = (id, data) =>
        $('app').contentWindow.postMessage({ id, success: true, version: '9.1.0', data }, '*');
      const fail = (id, error) =>
        $('app').contentWindow.postMessage({ id, success: false, version: '9.1.0', error }, '*');

      window.addEventListener('message', async (e) => {
        const msg = e.data;
        if (!msg || !msg.id || !msg.method) return;
        if (e.source !== $('app').contentWindow) return;
        try {
          switch (msg.method) {
            case 'getSafeInfo':
              note('getSafeInfo');
              return reply(msg.id, await safeInfo());
            case 'getChainInfo': {
              const id = parseInt(await rpc('eth_chainId'), 16);
              return reply(msg.id, {
                chainName: `chain ${id}`, chainId: String(id), shortName: String(id),
                nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18, logoUri: '' },
                blockExplorerUriTemplate: { address: '', txHash: '', api: '' },
              });
            }
            case 'getEnvironmentInfo':
              return reply(msg.id, { origin: location.origin });
            case 'rpcCall': {
              const { call: name, params } = msg.params;
              note(name);
              return reply(msg.id, await rpc(name, params));
            }
            case 'sendTransactions':
            case 'signMessage':
            case 'signTypedMessage':
              return fail(msg.id, `${msg.method} is not implemented by the development host`);
            default:
              return fail(msg.id, `unknown method ${msg.method}`);
          }
        } catch (err) {
          fail(msg.id, String(err && err.message ? err.message : err));
        }
      });

      $('load').addEventListener('click', () => {
        safeAddress = $('safe').value.trim();
        rpcUrl = $('rpc').value.trim();
        if (!/^0x[0-9a-fA-F]{40}$/.test(safeAddress)) return note('give a Safe address');
        note('framing…');
        $('app').src = `/?hostframe=1&t=${Date.now()}`;
      });

      if (/^0x[0-9a-fA-F]{40}$/.test(safeAddress)) $('load').click();
    </script>
  </body>
</html>
